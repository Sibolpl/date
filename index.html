<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zaproszenie ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="step1">
    <h1>Pójdziesz ze mną na randkę? ❤️</h1>

    <button id="yes">Tak</button>
    <button id="no">Nie</button>
</div>

<div id="step2" style="display:none;">
    <h2>Wybierz termin</h2>

    <input type="date" id="date">
    <input type="time" id="time">

    <textarea id="message" placeholder="Dodatkowa wiadomość"></textarea>

    <button id="send">Potwierdź</button>
</div>

<script src="script.js"></script>

</body>
</html>
